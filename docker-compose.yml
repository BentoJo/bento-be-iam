services:
  # ── PostgreSQL Database ──────────────────────────
  iam-db:
    image: postgres:16-alpine
    container_name: iam-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iam_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-iam}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - iam-db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iam_user} -d ${POSTGRES_DB:-iam}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - iam-network

  # ── IAM gRPC Microservice ───────────────────────
  iam-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iam-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-iam_user}:${POSTGRES_PASSWORD:-changeme}@iam-db:5432/${POSTGRES_DB:-iam}
      GRPC_PORT: ${GRPC_PORT:-50052}
    ports:
      - "${GRPC_PORT:-50052}:50052"
    depends_on:
      iam-db:
        condition: service_healthy
    networks:
      - iam-network

volumes:
  iam-db-data:
    driver: local

networks:
  iam-network:
    driver: bridge

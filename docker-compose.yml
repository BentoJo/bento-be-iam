version: '3.9'
services:
  iam-db:
    image: postgres:18
    container_name: iam-db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - backend-network
  iam-service:
    build:
      context: .
      target: runner 
    container_name: iam-service
    restart: always
    ports:
      - "5001:5001"
      - "50052:50052"
    env_file:
      - .env
    networks:
      - backend-network

volumes:
  postgres_data:

networks:
  backend-network:
    external: true